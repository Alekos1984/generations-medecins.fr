[build]
  publish = "mockup"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."veille-cron"]
  schedule = "0 5 * * *"

# Rappel de conservation des données (RGPD, tous les 3 ans) : chaque lundi à 8h UTC
[functions."conservation-cron"]
  schedule = "0 8 * * 1"

# Consultations : clôture automatique et rappel, chaque jour à 7h UTC
[functions."consultation-cron"]
  schedule = "0 7 * * *"

# Newsletter auto au vitriol : le 1er et le 15 du mois à 6h UTC
[functions."newsletter-cron"]
  schedule = "0 6 1,15 * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://faegpfkhlkkwmtaichin.supabase.co wss://faegpfkhlkkwmtaichin.supabase.co https://api.annuaire.sante.fr https://api-adresse.data.gouv.fr; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
