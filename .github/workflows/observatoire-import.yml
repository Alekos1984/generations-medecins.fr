name: Import Observatoire (RPPS + INSEE)

on:
  schedule:
    - cron: "0 4 1 * *"   # Le 1er de chaque mois à 4h UTC
  workflow_dispatch:        # Lancement manuel possible

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      # RPPS (effectifs, spécialités, âge, mode d'exercice) + population INSEE (API Melodi)
      # pour la densité médicale. Les chiffres se mettent à jour tout seuls chaque mois.
      - name: Lancer l'import RPPS
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/import_observatoire.py
        continue-on-error: true

      # Validation d'office : plus besoin de valider à la main chaque mois.
      # Appelle la fonction SQL observatoire_auto_validate() (service_role).
      - name: Valider automatiquement l'import
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/observatoire_auto_validate" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}'
