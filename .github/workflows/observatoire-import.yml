name: Import Observatoire (DREES + RPPS)

on:
  schedule:
    - cron: "0 4 1 * *"   # Le 1er de chaque mois à 4h UTC
  workflow_dispatch:        # Lancement manuel possible

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      # DREES = source principale (pré-agrégée, ~Mo, donne la tendance N vs N-1).
      # Tourne d'abord — si elle réussit, ses chiffres écrasent ceux de RPPS
      # dans la suite (les deux écrivent dans les mêmes colonnes *_pending).
      - name: Lancer l'import DREES
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/import_drees.py
        continue-on-error: true

      # RPPS = source de secours (brut 700 Mo, recompte sans tendance).
      # Si DREES a planté, on a au moins le compte brut.
      - name: Lancer l'import RPPS
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/import_observatoire.py
        continue-on-error: true
